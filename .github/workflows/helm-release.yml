name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "helm-charts/bifrost/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: builder-8-32
    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            registry-1.docker.io:443
            maximhq.github.io:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: step-security/setup-helm@104176d810f424da7451a3fe25620d40c4dfb883 # v5.0.1
        with:
          version: v4.0.0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"

      - name: Run chart-testing (lint)
        run: |
          helm lint helm-charts/bifrost --set image.tag=v2.5.1

      - name: Reject mutable image tag
        run: |
          for tag in latest latest-ubi9 latestfoo v1.2.3-01 v1.2.3-foo..bar; do
            if helm template bifrost helm-charts/bifrost --set image.tag="$tag" >/dev/null 2>&1; then
              echo "image.tag=$tag must be rejected" >&2
              exit 1
            fi
          done

      - name: Run full chart validator
        run: bash helm-charts/bifrost/scripts/validate.sh

      - name: Validate Helm templates
        run: |
          chmod +x .github/workflows/scripts/validate-helm-templates.sh
          .github/workflows/scripts/validate-helm-templates.sh

      - name: Validate Helm config fields
        run: |
          chmod +x .github/workflows/scripts/validate-helm-config-fields.sh
          .github/workflows/scripts/validate-helm-config-fields.sh

      - name: Validate Go ↔ config.schema.json ↔ helm-chart sync (schemasync)
        run: |
          chmod +x .github/workflows/scripts/validate-schema-sync.sh
          .github/workflows/scripts/validate-schema-sync.sh

      - name: Get chart version
        id: chart-version
        run: |
          VERSION=$(grep '^version:' helm-charts/bifrost/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Check if release exists
        id: check-release
        run: |
          source ./.github/workflows/scripts/release-state.sh
          TAG="helm-chart-v${{ steps.chart-version.outputs.version }}"
          TAG_AT_HEAD="false"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG points at a different commit" >&2
              exit 1
            fi
            TAG_AT_HEAD="true"
          fi
          if release_check "$TAG"; then
            if [ "$TAG_AT_HEAD" = "true" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "Release $TAG exists but its tag is missing" >&2
              exit 1
            fi
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "exists=false" >> $GITHUB_OUTPUT
            else
              echo "Could not determine release state for $TAG" >&2
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          cd helm-charts
          helm package bifrost

      - name: Create GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd helm-charts
          gh release create "helm-chart-v${{ steps.chart-version.outputs.version }}" \
            bifrost-${{ steps.chart-version.outputs.version }}.tgz \
            --target ${{ github.sha }} \
            --title "Helm Chart v${{ steps.chart-version.outputs.version }}" \
            --notes "Helm chart release for Bifrost v${{ steps.chart-version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm repository index
        run: |
          cd helm-charts
          # Download existing index. Only a definitive 404 means this is the first
          # publish; network/auth errors must not overwrite history with one chart.
          HTTP_CODE=$(curl -sS -o index.yaml -w '%{http_code}' https://maximhq.github.io/bifrost/helm-charts/index.yaml || echo 000)
          if [ "$HTTP_CODE" = "404" ]; then
            rm -f index.yaml
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "Could not download the existing Helm index (HTTP $HTTP_CODE)" >&2
            exit 1
          fi
          # Merge with new chart only if index.yaml exists
          if [ -f index.yaml ]; then
            helm repo index . --url https://github.com/maximhq/bifrost/releases/download/helm-chart-v${{ steps.chart-version.outputs.version }} --merge index.yaml
          else
            helm repo index . --url https://github.com/maximhq/bifrost/releases/download/helm-chart-v${{ steps.chart-version.outputs.version }}
          fi

      - name: Deploy to GitHub Pages
        uses: step-security/actions-gh-pages@db28a5e317d585916043c4acc5a4319ab3da9275 # v4.0.1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.5.0'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-charts
          destination_dir: helm-charts
          keep_files: false
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Login to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Helm chart as OCI artifact to GHCR
        run: |
          OCI_REF="oci://ghcr.io/maximhq/helm-charts/bifrost"
          OCI_ERR=$(mktemp)
          if helm show chart "$OCI_REF" --version "${{ steps.chart-version.outputs.version }}" >/dev/null 2>"$OCI_ERR"; then
            rm -f "$OCI_ERR"
            echo "OCI artifact already exists; skipping push"
          elif grep -qiE 'not found|404' "$OCI_ERR"; then
            rm -f "$OCI_ERR"
            helm push helm-charts/bifrost-${{ steps.chart-version.outputs.version }}.tgz oci://ghcr.io/maximhq/helm-charts
          else
            echo "Could not determine OCI artifact state:" >&2
            cat "$OCI_ERR" >&2
            rm -f "$OCI_ERR"
            exit 1
          fi

      # - name: Push Helm chart as OCI artifact to Docker Hub
      #   if: steps.check-release.outputs.exists == 'false'
      #   continue-on-error: true
      #   run: |
      #     helm push helm-charts/bifrost-${{ steps.chart-version.outputs.version }}.tgz oci://registry-1.docker.io/maximhq