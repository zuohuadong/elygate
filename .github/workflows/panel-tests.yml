name: Elygate Panel Tests

on:
  pull_request:
    paths:
      - "panel/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
  push:
    branches: [main]
    paths:
      - "panel/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elygate-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Test and build Svelte panel
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: panel
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: panel
        run: bun run test
      - name: Run Svelte checks
        working-directory: panel
        run: bun run check
      - name: Build panel
        working-directory: panel
        run: bunx vite build

  docker:
    name: Build production Docker image
    needs: panel
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build image without publishing
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile
          push: false
          tags: elygate:panel-ci
