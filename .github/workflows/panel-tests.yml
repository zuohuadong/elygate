name: Elygate Panel Tests

on:
  pull_request:
    paths:
      - ".bun-version"
      - "panel/**"
      - "enterprise/employee-portal/**"
      - "transports/bifrost-http/**"
      - "framework/configstore/**"
      - "framework/logstore/**"
      - "plugins/logging/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
      - ".github/workflows/scripts/smoke-elygate-image.sh"
      - "examples/single-node-postgres/**"
  push:
    branches: [main, dev]
    paths:
      - ".bun-version"
      - "panel/**"
      - "enterprise/employee-portal/**"
      - "transports/bifrost-http/**"
      - "framework/configstore/**"
      - "framework/logstore/**"
      - "plugins/logging/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
      - ".github/workflows/scripts/smoke-elygate-image.sh"
      - "examples/single-node-postgres/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elygate-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Test and build Svelte panel
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        working-directory: panel
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: panel
        run: bun run test
      - name: Run Svelte checks
        working-directory: panel
        run: bun run check
      - name: Build panel
        working-directory: panel
        run: bunx vite build

  docker:
    name: Build production Docker image
    needs: panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build image without publishing
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile
          push: false
          load: true
          tags: elygate:panel-ci
          build-args: |
            VERSION=${{ github.sha }}
      - name: Start image and verify runtime health
        env:
          IMAGE_COMMIT: ${{ github.sha }}
        run: bash .github/workflows/scripts/smoke-elygate-image.sh elygate:panel-ci "$IMAGE_COMMIT"

  employee-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: enterprise/employee-portal
      - run: bun run test && bun run check && bun run build
        working-directory: enterprise/employee-portal

  api-contracts:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.27.3"
      - name: Initialize Go workspace
        run: source ./.github/workflows/scripts/setup-go-workspace.sh
      - name: Run API contracts
        run: bash scripts/go-local.sh test -p 1 ./transports/bifrost-http/controlplane ./transports/bifrost-http/employees ./transports/bifrost-http/handlers -run 'Test(ApplicationKeyRouter|UsageReconciliation|LoginLimiter|Session|Auth|CorsAccessLog)' -count=1 -timeout=120s
