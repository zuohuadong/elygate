name: Elygate Panel Tests

on:
  pull_request:
    paths:
      - ".bun-version"
      - "panel/**"
      - "enterprise/employee-portal/**"
      - "transports/bifrost-http/**"
      - "framework/configstore/**"
      - "framework/logstore/**"
      - "plugins/logging/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
      - ".github/workflows/scripts/smoke-elygate-image.sh"
      - "examples/single-node-postgres/**"
      - "scripts/production/**"
      - "scripts/go-local.sh"
  push:
    branches: [main, dev]
    paths:
      - ".bun-version"
      - "panel/**"
      - "enterprise/employee-portal/**"
      - "transports/bifrost-http/**"
      - "framework/configstore/**"
      - "framework/logstore/**"
      - "plugins/logging/**"
      - "Makefile"
      - "transports/Dockerfile*"
      - ".github/workflows/panel-tests.yml"
      - ".github/workflows/scripts/smoke-elygate-image.sh"
      - "examples/single-node-postgres/**"
      - "scripts/production/**"
      - "scripts/go-local.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elygate-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Test and build Svelte panel
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify production preflight
        shell: bash
        run: |
          bash -n scripts/production/single-node-preflight.sh scripts/production/single-node-preflight.test.sh
          shellcheck scripts/production/single-node-preflight.sh scripts/production/single-node-preflight.test.sh
          bash scripts/production/single-node-preflight.test.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        working-directory: panel
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: panel
        run: bun run test
      - name: Run Svelte checks
        working-directory: panel
        run: bun run check
      - name: Build panel
        working-directory: panel
        run: bunx vite build

  docker:
    name: Build production Docker image
    needs: panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build image without publishing
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile
          push: false
          load: true
          tags: elygate:panel-ci
          build-args: |
            VERSION=${{ github.sha }}
      - name: Fix candidate image identity
        id: candidate
        shell: bash
        run: |
          image_id=$(docker image inspect elygate:panel-ci --format '{{.Id}}')
          if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "expected an immutable Docker image ID" >&2
            exit 2
          fi
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Start image and verify runtime health
        env:
          IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          IMAGE_COMMIT: ${{ github.sha }}
        run: bash .github/workflows/scripts/smoke-elygate-image.sh "$IMAGE_ID" "$IMAGE_COMMIT"
      - name: Export verified candidate image
        shell: bash
        env:
          IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          IMAGE_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] ||
            [[ ! "$IMAGE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "expected immutable image and source identities" >&2
            exit 2
          fi
          mkdir "$RUNNER_TEMP/elygate-candidate"
          cd "$RUNNER_TEMP/elygate-candidate"
          docker image save "$IMAGE_ID" | gzip -n > image.tar.gz
          docker image inspect "$IMAGE_ID" |
            jq -e --arg image "$IMAGE_ID" --arg commit "$IMAGE_COMMIT" '
              .[0] |
              select(.Id == $image and .Os == "linux" and
                (.Architecture | type == "string" and length > 0)) |
              {format: "docker-archive", archive: "image.tar.gz",
                source_commit: $commit, image_id: .Id, os: .Os,
                architecture: .Architecture}
            ' > provenance.json
          sha256sum image.tar.gz provenance.json > SHA256SUMS
          docker image load --input image.tar.gz > /dev/null
      - name: Retain verified candidate image
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: elygate-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/elygate-candidate/image.tar.gz
            ${{ runner.temp }}/elygate-candidate/provenance.json
            ${{ runner.temp }}/elygate-candidate/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  employee-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: enterprise/employee-portal
      - run: bun run test && bun run check && bun run build
        working-directory: enterprise/employee-portal

  api-contracts:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.27.3"
      - name: Initialize Go workspace
        run: source ./.github/workflows/scripts/setup-go-workspace.sh
      - name: Run API contracts
        run: bash scripts/go-local.sh test -p 1 ./transports/bifrost-http/controlplane ./transports/bifrost-http/employees ./transports/bifrost-http/handlers -run 'Test(ApplicationKeyRouter|UsageReconciliation|LoginLimiter|Session|Auth|CorsAccessLog)' -count=1 -timeout=120s
      - name: Run usage CSV export regression
        run: bash scripts/go-local.sh test -p 1 ./transports/bifrost-http/controlplane -run '^TestUsageCSVExport' -count=1 -timeout=180s
      - name: Run model catalog audit regressions
        run: bash scripts/go-local.sh test -p 1 ./transports/bifrost-http/handlers ./transports/bifrost-http/server -run '^TestModelCatalog' -count=1 -timeout=180s
