name: Release CLI

on:
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/workflows/release-cli.yml'
      - '.github/workflows/scripts/check-cli-release.sh'
      - '.github/workflows/scripts/release-artifacts.sh'
      - '.github/workflows/scripts/publish-cli-latest.sh'
      - '.github/workflows/scripts/configure-r2.sh'
      - '.github/workflows/scripts/r2-bucket.sh'
      - '.github/workflows/scripts/release-state.sh'
      - '.github/workflows/scripts/release-cli.sh'
      - '.github/workflows/scripts/upload-cli-to-r2.sh'
      - '.github/workflows/scripts/semver.sh'
      - '.github/workflows/scripts/changelog-utils.sh'
      - '.github/workflows/scripts/build-cli-executables.sh'

# Prevent concurrent runs
concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: builder-8-32
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from file
        id: get-version
        run: ./.github/workflows/scripts/read-version-file.sh cli/version

      - name: Configure R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash ./.github/workflows/scripts/configure-r2.sh

      - name: Check if tag exists
        id: check-tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: ./.github/workflows/scripts/check-cli-release.sh "cli/v${VERSION}" "bifrost" "bifrost-cli" "$VERSION"


  test-cli:
    needs: [check-version]
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: builder-8-32
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"

      - name: Run CLI tests
        working-directory: cli
        run: go test ./...

  release-cli:
    needs: [check-version, test-cli]
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: builder-8-32
    permissions:
      contents: write
    outputs:
      success: ${{ steps.release.outputs.success }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release CLI
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: ./.github/workflows/scripts/release-cli.sh "$VERSION"

  push-mintlify-changelog:
    needs: [check-version, release-cli]
    if: needs.check-version.outputs.tag_exists == 'false' && needs.release-cli.result == 'success'
    runs-on: builder-8-32
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Push Mintlify changelog
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          ./.github/workflows/scripts/push-cli-mintlify-changelog.sh "$VERSION"